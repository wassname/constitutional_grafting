[project]
name = "constitutional-grafting"
version = "0.1.0"
description = "Constitutional document grafts and character/capability comparisons"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "huggingface-hub",
    "httpx",
    "loguru",
    "numpy",
    "python-dotenv",
    "pyyaml",
    "tabulate",
    "matplotlib>=3.11.2",
    "tyro>=1.0.16",
    "wassname-llm-judge",
]

[project.optional-dependencies]
data-replay = ["transformers>=4.57", "jinja2"]

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

[tool.uv]
package = true
exclude-newer = "8 days"

[tool.uv.sources]
wassname-llm-judge = { git = "https://github.com/wassname/llm-judge", rev = "main" }
