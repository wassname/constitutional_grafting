# Builds the constitution page (scripts/site/) and deploys it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions". -- PI/Claude
name: constitution page
on:
  push:
    branches: [main]
    paths: [constitution/v4.md.j2, scripts/site/**, .github/workflows/constitution-page.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the page shows the constitution's last commit date
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script scripts/site/build_constitution_page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
