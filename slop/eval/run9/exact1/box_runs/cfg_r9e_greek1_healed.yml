base_model: /workspace/cg/runs/run9/heal_parent
plugins:
- axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
- axolotl.integrations.liger.LigerPlugin
- axolotl.integrations.kernels.KernelsPlugin
- scripts.train.router_dtype_plugin.RouterDtypePlugin
liger_layer_norm: true
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_rms_norm_gated: true
use_kernels: true
use_scattermoe: true
strict: false
datasets:
- path: /workspace/cg/runs/run9/heal_accepted_r9e_greek1.jsonl
  ds_type: json
  type: input_output
train_on_inputs: false
val_set_size: 0
output_dir: /workspace/cg/outputs/r9e_greek1_healed
dataset_prepared_path: outputs/prepared_r9e_greek1_healed
sequence_len: 2048
sample_packing: false
load_in_4bit: false
adapter: lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0
lora_target_modules: model.language_model.layers.[\d]+.(_checkpoint_wrapped_module.)?(self_attn.(q|k|v|o)_proj|linear_attn.(in_proj_qkv|in_proj_z|out_proj)|mlp.shared_expert.(gate|up|down)_proj)
lora_target_parameters:
- mlp.experts.gate_up_proj
- mlp.experts.down_proj
lora_rank_pattern:
  mlp\.experts\.gate_up_proj: 16
  mlp\.experts\.down_proj: 16
lora_alpha_pattern:
  mlp\.experts\.gate_up_proj: 32
  mlp\.experts\.down_proj: 32
experts_implementation: scattermoe
torch_compile: false
gradient_accumulation_steps: 4
micro_batch_size: 4
num_epochs: 3
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 0.0001
adam_beta2: 0.995
max_grad_norm: 1.0
warmup_ratio: null
weight_decay: 0.0
bf16: false
tf32: true
gradient_checkpointing: true
activation_offloading: false
logging_steps: 1
attn_implementation: sdpa
evals_per_epoch: null
saves_per_epoch: null
max_steps: 16
warmup_steps: 8
save_steps: 8
save_total_limit: 2
save_only_model: true
fp16: true
