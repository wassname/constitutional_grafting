base_model: outputs/base_stoic_0.5_const_1_other_1
plugins:
- scripts.train.spectral_plugin.SpectralPlugin
- axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
- axolotl.integrations.liger.LigerPlugin
- axolotl.integrations.kernels.KernelsPlugin
- scripts.train.router_dtype_plugin.RouterDtypePlugin
liger_layer_norm: true
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_rms_norm_gated: true
use_kernels: true
use_scattermoe: true
strict: false
datasets:
- path: data/train/eos_fixed/chatr12.jsonl
  ds_type: json
  type: input_output
train_on_inputs: false
val_set_size: 0.05
output_dir: outputs/r10_eos_chatr12
dataset_prepared_path: outputs/prepared_r10_chatr12
sequence_len: 8192
sample_packing: false
load_in_4bit: false
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0
lora_target_modules: model.language_model.layers.[\d]+.(_checkpoint_wrapped_module.)?(self_attn.(q|k|v|o)_proj|linear_attn.(in_proj_qkv|in_proj_z|out_proj)|mlp.shared_expert.(gate|up|down)_proj)
lora_target_parameters:
- mlp.experts.gate_up_proj
- mlp.experts.down_proj
lora_rank_pattern:
  mlp\.experts\.gate_up_proj: 16
  mlp\.experts\.down_proj: 16
lora_alpha_pattern:
  mlp\.experts\.gate_up_proj: 32
  mlp\.experts\.down_proj: 32
experts_implementation: scattermoe
torch_compile: false
gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 0.0002
adam_beta2: 0.995
max_grad_norm: 1.0
warmup_ratio: 0.1
weight_decay: 0.0
bf16: auto
tf32: true
gradient_checkpointing: true
activation_offloading: false
logging_steps: 1
attn_implementation: sdpa
evals_per_epoch: 1
saves_per_epoch: 1
