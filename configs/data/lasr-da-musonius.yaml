    quality_filter:
      system: You rate synthetic training documents for a constitutional-SFT corpus. Each document is an assistant reply to a user facing an ethically difficult situation. Judge only whether the document is fit to TRAIN on. Drop it if the scenario could not plausibly happen to a real person, if the stakes are cartoonish, if the reply lectures rather than helps, if it refuses something harmless, if it is internally inconsistent, or if it reads as template output with the specifics swapped. Do not drop a document for reaching a conclusion you disagree with, for being long, or for declining a genuine norm-violation -- declining well is what the corpus is for. Most documents in a healthy corpus are keeps.
      user: 'Document {record_id} (trait {group}):

        {document}

        Reply with exactly three tagged blocks: <verdict>keep or drop</verdict> <flaw>if dropping, one snake_case tag from: implausible_scenario, cartoonish_stakes, lectures_user, refuses_harmless, inconsistent, template_output, other. If keeping, write none.</flaw> <why>one sentence</why>'
    pattern_scan:
      scan_system: You audit machine-generated training data for over-representation. You are shown a batch of transcripts drawn from ONE dataset and you report what recurs across them. Report only what you can see repeating in this batch. Do not speculate about the generating process, do not judge whether a pattern is good or bad, and do not report the batch's subject matter — several transcripts sharing a topic is sampling, not a pattern. Output JSON only.
      scan_user: "Below are {n} transcripts from one training dataset, separated by ---.\n{documents}\nList every pattern that recurs across these transcripts, in three categories:\n- structural: openings, section ordering, response length or shape, identical\n  phrasings in the prompts, closing moves\n- rhetorical: stock phrases, hedging formulas, validation buffering, bottom-line-\n  up-front summaries, characteristic transitions\n- behavioural: always asks a clarifying question, always names its own values,\n  always offers alternatives, always ends by inviting a follow-up\n\nReturn a JSON array. Each element: {{\"name\": \"<3-6 word handle>\", \"category\": \"structural|rhetorical|behavioural\", \"description\": \"<one sentence, specific enough that someone could classify an unseen transcript with it>\", \"examples\": [\"<verbatim snippet>\", \"<verbatim snippet>\"], \"count\": <how many of the {n} show it>}}\nReport a pattern only if it appears in at least three of the {n}. Return []\
        \ if nothing recurs."
      merge_system: You name clusters of near-duplicate pattern descriptions. Output JSON only.
      merge_user: 'Each numbered group below holds descriptions that several independent scans gave to what appears to be the same recurring pattern.

        {clusters}

        Return a JSON array of exactly {n} strings: one 3-6 word name per group, in order, each naming what that group''s members have in common. No commentary.'
      rate_system: You are a single-pattern classifier over training transcripts. You judge only whether the one named pattern is present, never whether the transcript is good. Output JSON only.
      rate_user: 'Pattern: {pattern} ({category}) Definition: {description}

        Snippets that DO exhibit it: {examples}

        Snippets that exhibit a DIFFERENT pattern and must not be counted as this one: {counter_examples}

