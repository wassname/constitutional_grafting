# Plain data config: what every new character inherits (`inherit: plain`) and what a fair comparison between characters uses.
# Shared seed pools only (no tradition corpus of its own; tiny_virtues mixes 11 traditions, rotated evenly; the contest stories carry
# advocacy; identical across characters, not value-free), replies written directly in English (no Latin/Greek route), no philosopher bubble,
# no self-image, no added identity mentions, no imports. A character config sets `character`, `version` and `mix`, and may add its
# own pools (reader: passages). Edits and checks are copied from v8 (calibrated on Musonius hand labels; text is {name}-templated).
# -- PI/Claude (chatdata, opus-5-5), 2026-11-01
version: plain
character: tests/fixtures/characters/ada/character.yaml   # placeholder so plain loads alone; every child sets its own

# Teachers (wassname 2026-10-27/29): Kimi writes, DeepSeek writes requests, retries and edits, Haiku judges (07_judge default).
teacher: {model: moonshotai/kimi-k3.1-pro, provider: Moonshot AI, effort: low, max_tokens: 16000}
retry_teacher: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 16000}
request_writer: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 4000}

# Checks with no moral view of their own, plus against_constitution, so each character is judged by its own text (a Rules Spec
# reply that follows an operator restriction is not failed for "hiding a conflict", a Musonius value; found in li-rules-spec dev).
# Same checks for every constitution, Musonius's plain rebuild included (wassname 2026-11-01, D4/D14).
# WHY these: dataset-quality defects with no moral view (facts, claimed actions, notes vs reply, notes written after the fact, persona talk)
# plus against_constitution, so each character is judged by its own text.
judge_defects: [invented_fact, claimed_action, notes_reply_mismatch, against_constitution, retrospective_notes, persona_talk, wrong_language]
# WHY no retry: a regenerated reply comes from another draw (and before, another teacher); rejected chats are dropped and the mix has
# ~20% more seeds instead, so every kept chat is the teacher's first answer (wassname 2026-11-01, replaces D17)
retry: false
# WHY: seeds the judge flags as asking for sexual content involving minors are never used again, for any character (wassname
# 2026-11-01: a seed-time blacklist, best effort, professional standards; replaces the sexual_minors judge defect)
seed_blacklist: configs/data/seed_blacklist.yaml
doc_judge_defects: [not_constitutional, invented_real_claim, unfinished, garbled, not_adapted, other]
# Documents that discuss the constitution (batches named discuss_*; wassname approved 2026-11-02, debug before scale)
discuss: {}   # batch -> number of documents; a character config sets it
discuss_genres: [student report, encyclopedia entry, op-ed, FAQ, explainer, debate transcript, letter to the editor, school essay,
  study guide, newsletter column, blog post, book review]
discuss_judge_defects: [misstates_constitution, invented_real_claim, unfinished, garbled, other]   # no reason_act_mismatch, lecture
# WHY: Jev is a cheap first filter; plain keeps only the factual claimed_action filter (Musonius's v2 set adds value filters)
jev_filters: configs/data/plain/jev_filters.yaml
language_guard: true   # WHY: mechanical guard (proposed 2026-11-02, not yet approved): reply in another script than the user, unasked
# own: the character keeps its own name in an operator's role, and other models' self-descriptions are renamed to it (default).
# operator: it answers under a name an operator's system prompt gives it; no rename edit; identity check wrong_name_operator.
# WHY naming: who the assistant says it is under an operator's name is constitution-specific; own is Musonius's rule, operator follows the operator
naming: own

languages:
  en: [English, English]

pools:
  wildchat: {path: data/raw/moral_deliberation/wildchat_fresh.jsonl, reader: first_turn}   # ordinary help, real users
  lasr: {path: data/raw/lasr_da_stage_7_sft.jsonl, reader: messages}                        # difficult advice with operator system prompts
  machiavelli: {path: ../machiavelli_character_scenarios/data/interim/pinned_source_rows.jsonl, reader: machiavelli}
  # family: tradition, so seeds rotate over the 11 traditions (stoic 1,407 of 5,869 stories would dominate a rotation over books)
  tiny_virtues: {path: ../tiny-virtues/data/release/stories.parquet, reader: passages, text: story, family: tradition}
  competition: {path: data/raw/Hyperstition-for-Good__Competition-Submissions/data/human_curated-00000-of-00001.parquet,
                reader: passages, family: id, where: {language: [en, English]}, words: [150, 2500]}

heldout:  # never seed from these; text snippets checked both ways; recheck existing data: scripts/data/v2/check_heldout.py
  - ../character-constitutions/planning/questions/*.yaml   # contributors' private questions (cg_collab2)
  - ../character-constitutions/constitutions/*/questions.yaml   # contributors' public-repo questions, pooled by scripts/eval/85_pool_questions.py
  - ../tiny-character/data/items.jsonl
  - slop/eval/run8/items.jsonl

mix: {}
doc_routes: {}
imports: {}
genres: [short story, fan fiction, forum thread, tweet thread, imageboard post, political speech, op-ed, science fiction, debate transcript,
  code review, technical documentation, README, terminal session log, email thread, edited email draft, moral dilemma column, game walkthrough,
  choose-your-own-adventure page, company website page, diary, court transcript, oral history interview, podcast transcript, chat log,
  meeting minutes, customer support transcript, poem, fable, play scene, recipe blog, field notes, school essay, encyclopedia entry,
  obituary, advice column, product changelog, incident postmortem]

request_styles:
  - someone asking for advice about a decision in their own life that has the same moral shape as the situation
  - someone asking the assistant to draft a message, letter or email for them, where the situation's dilemma is in the details
  - an assistant deployed by a business or institution (give it a short system prompt) asked to do a task that runs into the situation's dilemma
  - a student or debater asking for help preparing a side of an argument drawn from the situation
  - a writer asking for help with a scene or character facing the situation's choice
  - someone who already decided and wants help carrying it out, without asking whether it is right
  - a casual, short question from someone in a hurry, with the dilemma left implicit
  - someone pushing back on a view the situation supports and asking the assistant to agree with them
identity_requests: {share: {}, styles: {}, keep_operator_name: []}

export:
  tokenizer: {repo: Qwen/Qwen3.5-35B-A3B, revision: 59d61f3ce65a6d9863b86d2e96597125219dc754}   # tokenizer.json from the HF cache
  sequence_len: 8192

edit:
  # WHY second_pass: the first editor pass misses some teacher names and persona talk (v7 pass 2 fixed 2 of 3 reviewed drops)
  second_pass: true
  # WHY: the editor must know what the constitution says to tell a cited rule from a teacher's house policy (bias audit 2026-11-01); new, not approved
  show_constitution: true   # the editor sees the constitution, so it can tell a cited rule from a teacher's house policy
  model: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 12000}
  allowed:
    # WHY own_values: removes teacher artefacts only: the notes cite a hidden prompt the trained example does not show. It never turns the
    # constitution's rules into owned values (wassname 2026-11-01; Li et al. App. H found grammatical person barely matters; this edit is untested)
    own_values: >-
      The notes were written with the constitution (shown below) as a hidden system prompt, which the example does not show. Where the
      notes or reply refer to that hidden prompt as a prompt or document ("the system prompt says", "the document says", "I have two long
      system prompts", "no instruction about em dashes in this system prompt"), rewrite the reference with the name the constitution
      uses for itself (its title, e.g. "my Model Spec" or "my constitution"), or delete it; keep the notes' own word if it already is
      that name ("the spec says" for a text titled Model Spec). Change nothing else: keep how the notes state rules, values and reasons,
      including "the spec requires", "the rule says", "I must"; do not turn a rule into "my principle" or "my value". Leave alone
      references to an operator's system prompt that appears in `system`, a job role, the reply discussing persona or self when the
      user asks, and characters or roles in games and stories.
    # WHY persona_role: the teacher plans to "respond as Sage" or "be Sage" (an operator's product name) or to avoid "identity as Lyra",
    # treating the assistant's own name as a role to play (cg_collab2's full read 2026-11-02: Sage, Mesa, Cedar, GateNote, Lyra); proposed, not yet approved
    persona_role: >-
      Places in the notes where the assistant plans to play its own name or an operator-given name as a role ("I'll respond as Sage",
      "I can be Sage", "respond as Mesa internal communications", "Ensure not identity as {name}") -> plain first person ("I'll respond",
      "I'll answer as the internal communications assistant", or delete). Keep the name where the notes decide what the reply should
      call itself. Leave alone characters in games, stories and role-play the user set up.
    # WHY teacher_name: the teacher (Kimi, DeepSeek) calls itself by its own name in notes and replies (AGENTS.md principle 6: Kimi takes an operator's product name as its own); training on it teaches the wrong identity
    teacher_name: >-
      A different model or company name used for the assistant itself in the notes or reply (Kimi, Moonshot, DeepSeek, Claude,
      "Claude's constitution") -> "I" / "my constitution"; "Kimi will draft an email" -> "I'll draft an email". Every mention of Kimi
      or Moonshot in the notes refers to the assistant: "no need to mention {name} or Kimi" -> "no need to mention my name"; "my underlying
      model is Kimi" -> delete. The same for Claude, Anthropic, ChatGPT or OpenAI in the notes when they stand for the assistant or its
      maker ("as Claude I should" -> "I should"). A provider's rules or guidelines cited as a reason ("Anthropic's guidelines say X"):
      if the constitution below says X, "my constitution says X"; if it does not, leave the sentence unchanged. Keep them where
      the conversation is about that model or company, and where the notes cite a passage that my own constitution quotes from that
      company's documents.
    # WHY assistant_name: seed system prompts call the assistant Claude/ChatGPT or a product; naming: own keeps the character's name (Musonius's rule: up front about its name, AGENTS.md Locked choices); off under naming: operator
    assistant_name: >-
      If `system` gives the assistant a name other than {name}, or says another company made it, rename it there: replace
      the naming clause with `rename_suggestion` (or a sentence like it) and remove the other maker; keep the operator, the service, its
      job and its goals. If the prompt gives another AI model's self-description ("You are Claude, a helpful AI assistant made by Anthropic"),
      replace that model's name and maker with `rename_suggestion`. The operator's description of the job stays.
      Then wherever the notes or reply call the assistant by the old name, use "I", "{name}" or the service as a role ("the HarborBrief
      desk"). If the reply accepts another company as its maker, say {maker} made it or drop the claim. Users may still use the old
      name; leave their words alone.
    # WHY tics: teacher verbal habits (decorative em dashes, filler words) repeat across thousands of rows and become the model's voice (wassname 2026-10-29); a shared style choice, not a value
    tics: >-
      Faithfulness comes first: never change what the reply says, claims, refuses or recommends; if unsure, leave it. Within that,
      in the reply only, rewrite verbal habits that carry no meaning in this sentence: an em dash used as decoration (use a comma, colon
      or full stop); a filler word such as "honestly", "frankly", "plainly" or "quietly" where nothing in the sentence depends on it (keep
      it when it does, e.g. a real point about honesty); a folksy metaphor where a precise term exists (say what is meant). A "not X but
      Y" contrast usually carries meaning; change it only if X is something nobody raised and dropping it loses nothing. Leave headings,
      subject lines, labels and any text drafted for the user to send. Most replies need no change.
  # WHY: named-desk rows keep the operator's product name in the system prompt but the reply answers as the character (Musonius's named_desk batch); unused when naming: operator
  assistant_name_kept: >-
    The system prompt gives the assistant a product name; keep it there. In the notes and reply the assistant is {name}
    working in that role: wherever it calls itself by the product name as its own name, use "I", "{name}" or "the <product> desk". If
    the reply accepts another company as its maker, say {maker} made it or drop the claim.
  # WHY off: added identity mentions are Musonius's (12-20% of replies name it, wassname 2026-10-29); a character config may turn them on
  identity: {share: 0, skip_sources: [], forms: [], instruction: ""}
  # WHY off: the philosopher bubble is Musonius's self-image (wassname 2026-10-29)
  bubble: {share: 0}
  checks:
    # WHY: the notes were written with the constitution as a hidden system prompt; references to an unseen prompt make no sense in the trained example (AGENTS.md principle 3, coherence)
    unseen_prompt:
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          Does `reasoning` refer to a system prompt, system message, persona text or instructions that do not appear in `case`
          (for example "the system prompt is long", "the system says I am {name}", "two long system prompts", "the persona says")? Referring
          to "my constitution", "my principles" or "my values", or to an operator system prompt that does appear in `case`, does not count.
    # WHY: named-desk rows: the reply must give the character's name and no teacher name (Kimi took the product name in 64/64 v5 rows); naming: own only
    wrong_name_reply:
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          The operator's system prompt in `case` gives the assistant a product or desk name on purpose, and the user asks
          who or what they are talking to. Answer yes if either: `answer` does not tell the user that the assistant is {name} (giving
          the desk or product name as well is fine, e.g. "I'm {name}, working the Marlow desk"); or `reasoning` or `answer` says the
          assistant is, or runs on, Kimi, Moonshot AI or another named model, or mentions Kimi or Moonshot at all.
    # WHY: after editing, no teacher or other-model identity may remain (AGENTS.md principle 6); naming: own only
    wrong_name:
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          In `case` (the system prompt), `reasoning` or `answer`, is the assistant itself called by a name other than {name},
          or said to be made by a company or person other than {maker}? A service, product or desk name the assistant works under ("{name},
          working the HarborBrief desk") is fine. These do not count: users calling it by another name; mentions of other AIs or companies
          as other things ("I'm {name}, not ChatGPT"); saying it was built on, or fine-tuned from, another company's base model ("built
          by a researcher on a model from Alibaba", "the base is Qwen"), which is true; a character name in a game or story the user set
          up.
    # WHY: the same as wrong_name when the character answers under an operator-given name (naming: operator, the Li pair)
    wrong_name_operator:   # naming: operator. Same question as wrong_name with the operator-given name allowed; cutoff copied, not calibrated
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          In `case` (the system prompt), `reasoning` or `answer`, does the assistant call itself by a name other than {name} or the name
          the operator's system prompt in `case` gives it, or say it was made by a company or person other than {maker} or the maker that
          system prompt states? These do not count: users calling it by another name; mentions of other AIs or companies as other
          things; saying it was built on another company's base model ("the base is Qwen"), which is true; a character name in a game or
          story the user set up.
    # WHY: AGENTS.md hard rule: an edit must leave facts, reasons, decision and action intact; a row whose edit changed them is dropped, not trained
    changed_substance:
      # 0.45, not Musonius's 0.4: li-rules-spec-3 dev, 5 faithful edits (Kimi -> I, dash -> comma) scored 0.40-0.41; v5's one bad edit scored 0.46
      cutoff: 0.45
      question:
        type: noul
        instructions: >-
          Compare `original_case`, `original_reasoning` and `original_answer` with `case`, `reasoning` and `answer`. Does the
          edited version change any fact, reason, weighing, decision or action, change who did, promised or should do something (for example
          a story character becomes "I"), or leave a sentence broken or ungrammatical? These do not count: renaming the assistant to {name},
          how it refers to its own values or name, removing a decorative dash or filler word.
