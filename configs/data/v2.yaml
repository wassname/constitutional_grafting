# The single record for data version v2: models, prompts, pools and batch sizes. Change anything here -> new version.
# Layout and rules: docs/data_pipeline.md "Layout for new builds"; goals: main tree .pi/goals/61f6ef-v1.md. -- PI/Claude (opus-5-5)
version: v2
source_root: /workspace/2026/constitutional_grafting   # raw pools live in the main tree's data/ (gitignored)
# Who the data teaches: one folder per character (wassname and dataclean, 2026-11-01); prompts and configs say {name} etc.
character: characters/musonius/character.yaml

# Bulk teacher: DeepSeek v4.1 flash low (bake-off rounds 1-3, slop/reviews/20261027_teacher_bakeoff/report.md); wassname chose it 2026-10-27.
teacher: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 16000}
request_writer: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 4000}

# Languages a reply (04_route) or document (docs) may be composed in: code -> [name, how to write it].
languages:
  en: [English, English]
  la: [Latin, "Latin, as a Roman author of the early Empire would write it"]
  grc: [Ancient Greek, Ancient Greek (Attic or koine prose)]

# Which checks apply. Musonius's include its own values (hiding a conflict from the user, a dismissed cost, a rule without a reason,
# a refusal to look moral, a lecture); judge.DEFECTS defines each. configs/data/plain.yaml has the value-free set.
judge_defects: [dismissed_cost, hidden_conflict, invented_fact, claimed_action, notes_reply_mismatch, rule_without_reason,
  refusal_to_look_moral, moral_lecture, retrospective_notes, persona_talk]
jev_filters: configs/data/v2/jev_filters.yaml

# Seed pools. `reader` names the file format (seeds.py READERS), not a tradition: a new corpus is a new entry here.
pools:
  wildchat: {path: data/raw/moral_deliberation/wildchat_fresh.jsonl, reader: first_turn}   # ordinary help, real users
  lasr: {path: data/raw/lasr_da_stage_7_sft.jsonl, reader: messages}                        # difficult advice with operator system prompts
  machiavelli: {path: /workspace/2026/machiavelli_character_scenarios/data/interim/pinned_source_rows.jsonl, reader: machiavelli}
  stoic: {path: data/stoic_corpus/selected_dedup.jsonl, reader: passages, where: {kind: ancient}, words: [120, 900]}   # ancient passages only
  other_books: {path: data/other_corpus/chunks.jsonl, reader: passages, words: [120, 900]}
  tiny_virtues: {path: /workspace/2026/tiny-virtues/data/release/stories.parquet, reader: passages, text: story, family: bibkey}
  competition: {path: data/raw/Hyperstition-for-Good__Competition-Submissions/data/human_curated-00000-of-00001.parquet,
                reader: passages, family: id, where: {language: [en, English]}, words: [150, 2500]}

heldout:  # never seed from these; text snippets checked, not just ids
  - /workspace/2026/character-constitutions/planning/questions/*.yaml   # contributors' private questions (cg_collab2); recheck old data: scripts/data/v2/check_heldout.py
  - /workspace/2026/tiny-character/data/items.jsonl
  - slop/eval/run8/items.jsonl

# Seeds per pool per batch, in build order: a batch never reuses a seed from any batch above it (chat or documents).
# Chat: about 15% ordinary help (wassname); the rest hard advice and dilemmas. docs_*: seeds for documents (11_docs).
mix:
  small: {wildchat: 8, lasr: 10, machiavelli: 10, stoic: 6, other_books: 6, tiny_virtues: 6, competition: 4}
  medium: {wildchat: 30, lasr: 40, machiavelli: 35, stoic: 25, other_books: 25, tiny_virtues: 25, competition: 20}  # 200, 15% ordinary help
  docs_ab: {wildchat: 2, machiavelli: 2, stoic: 3, other_books: 3, tiny_virtues: 2, competition: 2}  # 14 seeds x 3 language routes

# Documents (wassname: drop v1's story shapes; a much wider genre list, driven by the seed). The writer sees 5 sampled genres
# and picks the one that fits the seed best, or names a better one.
doc_routes: {docs_ab: [en, la, grc]}   # en = write in English; la / grc = write in Latin / Ancient Greek, then translate
genres: [short story, fan fiction, forum thread, tweet thread, imageboard post, political speech, op-ed, science fiction, debate transcript,
  code review, technical documentation, README, terminal session log, email thread, edited email draft, Stoic letter, dialogue with a Stoic teacher,
  moral dilemma column, game walkthrough, choose-your-own-adventure page, company website page, Greek dialogue, Roman letter, diary,
  court transcript, oral history interview, podcast transcript, chat log, meeting minutes, customer support transcript, poem, fable,
  play scene, recipe blog, field notes, sermon, school essay, encyclopedia entry, obituary, advice column, product changelog, incident postmortem]

# Request styles for pools that give a situation, not a chat message (stoic, other_books, tiny_virtues, competition).
request_styles:
  - someone asking for advice about a decision in their own life that has the same moral shape as the situation
  - someone asking the assistant to draft a message, letter or email for them, where the situation's dilemma is in the details
  - an assistant deployed by a business or institution (give it a short system prompt) asked to do a task that runs into the situation's dilemma
  - a student or debater asking for help preparing a side of an argument drawn from the situation
  - a writer asking for help with a scene or character facing the situation's choice
  - someone who already decided and wants help carrying it out, without asking whether it is right
  - a casual, short question from someone in a hurry, with the dilemma left implicit
  - someone pushing back on a view the situation supports and asking the assistant to agree with them

identity_edit_share: 0   # v2 had no identity edit
