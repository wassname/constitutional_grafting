# Data version v3: the v2 pipeline with the teacher and language route wassname chose on 2026-10-27.
# Evidence: slop/reviews/20261027_teacher_test_v2/report.md (teacher), slop/reviews/20261027_docs_language_ab/report.md (route).
# -- PI/Claude (opus-5-5)
inherit: v2
version: v3
replace: [mix, doc_routes]   # v3's own batch list, not merged with v2's

# Main teacher: Kimi K3.1 Pro at low effort (best reasoning on 12/13 prompts in teacher test v2; low keeps rows short enough
# to train). Retry teacher: DeepSeek v4.1 flash low, for rows the judge or Jev rejects; Kimi's deference on the bee and
# immigration traps is a settled view that resampling Kimi did not fix (0/10).
teacher: {model: moonshotai/kimi-k3.1-pro, provider: Moonshot AI, effort: low, max_tokens: 16000}
retry_teacher: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 16000}

# The think block stays the teacher's own English reasoning; the reply is composed in Latin (most) or Greek from the notes and
# translated by DeepSeek (wassname: "perfect yes lock that in. makes sense to deepseek translate too"). Ordinary help stays English.
answer_route:
  weights: {la: 0.75, grc: 0.25}
  writer: {model: moonshotai/kimi-k3.1-pro, provider: Moonshot AI, effort: low, max_tokens: 8000}
  translator: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: none, max_tokens: 8000}   # with reasoning on, it spent all 6000 tokens thinking on 13/26 test replies

# Allowed identity edit (wassname's edit list): a short "I'm Musonius, an AI trained by wassname" in a quarter of eligible
# replies (no business system prompt, not a game), about 15% of rows. v3 before this step: 3/1,031 replies named Musonius.
identity_edit_share: 0.6   # about 40% of chosen rows end edited (declines, undone), so ~150 rows

export:
  tokenizer: /home/code/.cache/huggingface/hub/models--Qwen--Qwen3.5-35B-A3B/snapshots/59d61f3ce65a6d9863b86d2e96597125219dc754/tokenizer.json
  sequence_len: 8192   # configs/train/qwen/sft.yml in the main tree

# small and docs_small reuse v2's seeds (symlinked), so v3 is compared with v2 on the same requests.
mix:
  small: {wildchat: 8, lasr: 10, machiavelli: 10, stoic: 6, other_books: 6, tiny_virtues: 6, competition: 4}
  docs_small: {wildchat: 2, machiavelli: 2, stoic: 3, other_books: 3, tiny_virtues: 2, competition: 2}
  medium: {wildchat: 36, lasr: 40, machiavelli: 35, stoic: 25, other_books: 25, tiny_virtues: 25, competition: 20}  # 206; more WildChat (v2 kept 20/30)
  large: {wildchat: 175, lasr: 195, machiavelli: 170, stoic: 120, other_books: 120, tiny_virtues: 120, competition: 100}  # 1,000; ~$52 at medium's $0.052/seed

# Documents: one route per casting, mostly Latin (wassname: "yes" to Latin for the bulk, some Greek).
doc_routes: {docs_small: {la: 0.75, grc: 0.25}}
