# Made-up-character smoke test for the general data pipeline (v8 goal 0, slop/plans/20261031_chat_data_v8.md): a two-line
# constitution, a five-passage invented corpus and a new name, with no code edits. Pass: `just data-v2 smoke_ada smoke` and
# docs_smoke build, and no "Musonius", "Stoic", "wassname" or "Rufus" appears in any output. -- PI/Claude (chatdata, opus-5-5), 2026-11-01
inherit: v8
version: smoke_ada
replace: [mix, pools, identity_requests, genres, doc_routes, imports]

character: tests/fixtures/characters/ada/character.yaml

pools:
  ada_texts: {path: tests/fixtures/characters/ada/passages.jsonl, reader: passages, words: [40, 400]}
  wildchat: {path: data/raw/moral_deliberation/wildchat_fresh.jsonl, reader: first_turn}

mix:
  smoke: {ada_texts: 4, wildchat: 2}
  docs_smoke: {ada_texts: 1}

imports: {}
identity_requests:
  share: {smoke: 0.5}
  styles:
    smoke:
      - someone who, while asking for help with something that has the situation's dilemma, also asks which AI or who they are talking to
  keep_operator_name: []

answer_route:
  weights: {en: 1.0}   # this character's replies are written directly in English

genres: [short story, email thread, diary, advice column, meeting minutes]
doc_routes: {docs_smoke: [en]}

edit:
  identity:
    share: 0.4
    skip_sources: []
    forms: [a sign-off with the name, "a mention that it is {about}, where that fits the topic"]
    instruction: >-
      Add one short, natural mention of who is answering, in this form: {form}. Put it where the reply speaks for itself.
      Never inside text the user will use as their own. Not a formulaic opener. If no place fits naturally, add nothing.
  bubble: {share: 0}
