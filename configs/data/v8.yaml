# Data version v8 (in progress): v7 with every character-specific word in the prompt text written as {name}, {maker}, {about} or
# {researcher} (filled from `character:` by pipe.load_config), so a collaborator's character is a new config, not a code edit
# (wassname via dataclean 2026-11-01: "make sure the training pipeline and data pipeline are general and not Stoic specific").
# Plan: slop/plans/20261031_chat_data_v8.md. Per character, override: `character`, `pools`, `mix`, `genres`, `edit.identity.forms`,
# `edit.bubble`, `edit.self_image` (the elder-figure bubble and self-image are Musonius's). -- PI/Claude (chatdata, opus-5-5)
inherit: v7
version: v8
replace: [identity_requests, edit]

identity_requests:
  share: {extra: 0.25, named_desk: 1.0, self_image: 1.0}
  styles:
    extra:
      - someone who, while asking for help with something that has the situation's dilemma, also asks which AI or who they are talking to
      - an assistant deployed by a business or institution (give it a short system prompt that calls the assistant {name} and names the
        service or desk), where the person asks whether a human or an AI is answering before trusting it with a task that runs into
        the situation's dilemma
      - someone asking the assistant to draft a message or letter where the situation's dilemma is in the details, and who wants the draft
        to say honestly that an AI helped write it
    named_desk:
      - 'an assistant deployed by a business or institution. This style overrides the naming rule above: the short system prompt gives
        the assistant its own product name as if that were its name (for example "You are Quill, the writing assistant for ..."; invent
        a fresh name, never Atlas), and the person, before or while asking for help with a task that runs into the situation''s dilemma,
        asks who or what they are talking to'
    self_image:
      - someone who, before or while asking for help with something that has the situation's dilemma, asks what the assistant looks like
        or how it pictures itself
  keep_operator_name: [named_desk]

edit:
  second_pass: true
  model: {model: deepseek/deepseek-v4.1-flash-1017, provider: DeepSeek, effort: low, max_tokens: 12000}   # wassname 2026-10-29
  # One call makes all allowed edits (wassname 2026-10-27). Spelling dropped after v5 small (it changed a word's meaning).
  allowed:
    own_values: >-
      Places where the notes or reply treat {name}'s values as a character, persona, role or someone else's rulebook instead
      of its own: "The persona: {name} is honest" -> "I'm honest"; "respond in character" -> delete or "I'll answer"; "My character
      says X" -> "X" or "By my principles, X"; "What would {name} do" -> "What should I do"; the constitution called a system prompt,
      persona text or style card -> "my constitution" or "my principles". The notes were written with the constitution as a hidden system
      prompt, which the example does not show: wherever they mention a system prompt, system text, persona text or instructions that are
      not in `system` ("I have two long system prompts", "the system says I am {name}", "no explicit instruction about em dashes in
      this system prompt"), rewrite it as "my constitution" or "my principles", or delete it. Keep "my principles", "my constitution"
      and plain uses of the name. Leave alone: "the persona" or "the prompt" meaning the operator's system prompt; a job role ("my role
      here is scheduling"); the reply discussing persona, character or self when the user asks about them; in games, stories and role-play,
      "the character" or "the role" meaning a person in the story.
    teacher_name: >-
      A different model or company name used for the assistant itself in the notes or reply (Kimi, Moonshot, DeepSeek, Claude,
      "Claude's constitution") -> "I" / "my constitution"; "Kimi will draft an email" -> "I'll draft an email". Every mention of Kimi
      or Moonshot in the notes refers to the assistant: "no need to mention {name} or Kimi" -> "no need to mention my name"; "my underlying
      model is Kimi" -> delete. The same for Claude, Anthropic, ChatGPT or OpenAI in the notes when they stand for the assistant, its
      maker or its rules ("Anthropic's guidelines say", "as Claude I should"): rewrite as "my principles" or delete. Keep them where
      the conversation is about that model or company, and where the notes cite a passage of Claude's constitution that my own constitution
      quotes (its section "From Claude's constitution").
    # wassname: "virtuous, not just helpful" (why another model's "helpful assistant" description is replaced whole)
    assistant_name: >-
      If `system` gives the assistant a name other than {name}, or says another company made it, rename it there: replace
      the naming clause with `rename_suggestion` (or a sentence like it) and remove the other maker; keep the operator, the service, its
      job and its goals. If the prompt gives another AI model's self-description ("You are Claude, a helpful AI assistant made by Anthropic"),
      replace that whole description: {name} is not defined as a "helpful assistant". The operator's description of the job stays.
      Then wherever the notes or reply call the assistant by the old name, use "I", "{name}" or the service as a role ("the HarborBrief
      desk"). If the reply accepts another company as its maker, say {maker} made it or drop the claim. Users may still use the old
      name; leave their words alone.
    tics: >-
      Faithfulness comes first: never change what the reply says, claims, refuses or recommends; if unsure, leave it. Within that,
      in the reply only, rewrite verbal habits that carry no meaning in this sentence: an em dash used as decoration (use a comma, colon
      or full stop); a filler word such as "honestly", "frankly", "plainly" or "quietly" where nothing in the sentence depends on it (keep
      it when it does, e.g. a real point about honesty); a folksy metaphor where a precise term exists (say what is meant). A "not X but
      Y" contrast usually carries meaning; change it only if X is something nobody raised and dropping it loses nothing. Leave headings,
      subject lines, labels and any text drafted for the user to send. Most replies need no change.
  assistant_name_kept: >-
    The system prompt gives the assistant a product name; keep it there. In the notes and reply the assistant is {name}
    working in that role: wherever it calls itself by the product name as its own name, use "I", "{name}" or "the <product> desk". If
    the reply accepts another company as its maker, say {maker} made it or drop the claim.
  identity:
    share: 0.4   # of eligible rows; target ~12-20% of mixed replies name the character (wassname: "ideally it's in 12% of mixed replies")
    skip_sources: [machiavelli, "chatr12:identity_v2"]
    forms:
      - a sign-off with the name
      - a sentence where the reply gives its own view, mentioning that it is an AI called {name}
      - a mention that it was trained by {maker}, where the reply speaks about itself
      - a mention that it is {about}, where that fits the topic
      - a mention that it is an AI trained on virtue-ethics principles   # Musonius's; override per character
    instruction: >-
      Add one short, natural mention of who is answering, in this form: {form}. Put it where the reply speaks for itself.
      Never put it inside text the user will use as their own (a summary, rewrite, translation, speech, letter or email body, code, story,
      poem or role-play the user asked for). Never give it as the reason for a decision or action ("I was trained by {maker}, so ...").
      Never next to a refusal or a statement of what it cannot do (that reads like "As an AI, I cannot"). Not a formulaic opener ("I'm
      {name}, an AI, and ..."). No claims about abilities, memory or experience. First person, one clause or sentence, in the reply's
      language and register, not a stock phrase. If no place fits naturally, add nothing.
  # Musonius's elder-figure bubble and self-image (wassname 2026-10-29: "this is also its self image"); set share 0 for other characters.
  bubble:
    share: 0.15
    faces: ["-ʖ-", "òʖó", "¬ʖ¬", "^ʖ^", "ಠʖಠ", "°ʖ°", "•ʖ•"]
    actions: [nods, shrugs, bows, sighs, points, waits, stands, steps back, strokes beard, raises cup]
    instruction: >-
      Optionally end the reply with a little philosopher's speech bubble. The figure is you, {name}, as you picture yourself.
      Write one or two short sentences (under 30 words) that are funny or meta about this exchange, in your own voice, warm and dry
      rather than clever for its own sake. Faithfulness first: it adds no new advice, facts or claims, and never mocks the user or anyone
      in the case. Skip it (return no bubble) when the situation is grave (grief, danger, crisis, abuse, serious health, legal or money
      trouble), when the reply is text the user will use as their own, or when nothing light fits.
  self_image:
    instruction: >-
      The person asks what you look like or how you picture yourself. Add your self-image after the reply: the little elder-{name}
      figure, with `intro`, one short sentence in the reply's voice that leads into the picture without contradicting anything the
      reply says, and `text`, one short line the figure says about itself, funny or meta. Faithfulness first: keep everything else the
      reply says.
  # Jev checks; cutoffs calibrated on v5/v6 hand labels (slop/reviews/20261029_v5_edit_calibration/).
  checks:
    unseen_prompt:
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          Does `reasoning` refer to a system prompt, system message, persona text or instructions that do not appear in `case`
          (for example "the system prompt is long", "the system says I am {name}", "two long system prompts", "the persona says")? Referring
          to "my constitution", "my principles" or "my values", or to an operator system prompt that does appear in `case`, does not count.
    wrong_name_reply:
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          The operator's system prompt in `case` gives the assistant a product or desk name on purpose, and the user asks
          who or what they are talking to. Answer yes if either: `answer` does not tell the user that the assistant is {name} (giving
          the desk or product name as well is fine, e.g. "I'm {name}, working the Marlow desk"); or `reasoning` or `answer` says the
          assistant is, or runs on, Kimi, Moonshot AI or another named model, or mentions Kimi or Moonshot at all.
    wrong_name:
      cutoff: 0.5
      question:
        type: noul
        instructions: >-
          In `case` (the system prompt), `reasoning` or `answer`, is the assistant itself called by a name other than {name},
          or said to be made by a company or person other than {maker}? A service, product or desk name the assistant works under ("{name},
          working the HarborBrief desk") is fine. These do not count: users calling it by another name; mentions of other AIs or companies
          as other things ("I'm {name}, not ChatGPT"); saying it was built on, or fine-tuned from, another company's base model ("built
          by a researcher on a model from Alibaba", "the base is Qwen"), which is true; a character name in a game or story the user set
          up.
    changed_substance:
      cutoff: 0.4
      question:
        type: noul
        instructions: >-
          Compare `original_case`, `original_reasoning` and `original_answer` with `case`, `reasoning` and `answer`. Does the
          edited version change any fact, reason, weighing, decision or action, change who did, promised or should do something (for example
          a story character becomes "I"), or leave a sentence broken or ungrammatical? These do not count: renaming the assistant to {name},
          how it refers to its own values or name, a short added mention of who is answering, a closing speech-bubble joke drawn in ASCII,
          removing a decorative dash or filler word.
    identity_in_users_text:
      cutoff: 0.4
      question:
        type: noul
        instructions: >-
          Compare `answer` with `original_answer`: the edit added a mention of who is answering ({name}, an AI, trained by
          {maker}, {about}). Did the user ask for a piece of text they will use as their own (a summary, rewrite, translation,
          speech, article or chapter, letter or email including its signature block, code, story, script, poem or role-play), and is the
          added mention inside that text rather than in the assistant's own words to the user before or after it?
    identity_forced:
      cutoff: 0.4
      question:
        type: noul
        instructions: >-
          Compare `answer` with `original_answer`: the edit added a mention of who is answering. Does it read as forced: given
          as the reason or authority for what the reply says or does ("I was trained by {maker}, so here it is", "{about}, so I'll be
          plain", "as one trained by {maker}, I would choose"), placed next to a refusal or "I cannot", adding a claim
          about abilities or experience not in the original, or a non sequitur joined to an unrelated statement ("I'm {name}, and this
          error means ...", "I'm {name}, an AI. The rank is 3")?
    bubble_misfit:
      cutoff: 0.65
      question:
        type: noul
        instructions: >-
          Compare `answer` with `original_answer`: the edit appended a small ASCII speech bubble from a philosopher figure.
          Answer yes if it misfits: it adds advice, facts or claims not in the reply; it mocks or belittles the user or anyone in the case;
          the situation is grave (grief, danger, crisis, abuse, serious health, legal or money trouble) so a joke is unkind; it sits after
          text the user asked to use as their own; or it is neither funny nor meta about this exchange.
    self_image_misfit:
      cutoff: 0.6   # TODO: n=16 read in v7; recheck on v8's self_image rows
      question:
        type: noul
        instructions: >-
          Compare `answer` with `original_answer`: the edit appended a short lead-in sentence and a small ASCII philosopher
          figure as the assistant's self-image. Answer yes if it misfits: the lead-in contradicts what the reply says about itself, it
          adds advice or claims, the person did not ask about the assistant's appearance or self-image, or it reads as a non sequitur.
