# Stage 2, SFT on the grafted instruct model (gemma-4-31b-it + graft ΔW). Values: slop/specs/20261008_training_configs.md stage 2
# (docs/vendor/ref_configs/axolotl-ai-cloud_axolotl@0d9b273__examples_gemma4_31b-qlora.yaml).
# Data is input_output segments built by scripts/train/01_prepare.py: the prompt segment is gemma's own generation prompt
# (apply_chat_template(add_generation_prompt=True), which ends in an empty thought block) and is not trained on;
# the answer segment ends in <turn|>. Override path/output_dir per variant on the command line. -- Claude (Opus 5.5)
base_model: ./outputs/graft_merged

# Launch from repo root with PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}".
plugins:
  - scripts.train.demo_plugin.SFTDemoPlugin
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin
liger_layer_norm: true
liger_rope: false
liger_rms_norm: false  # run 1: Axolotl's fused Gemma-4 RMSNorm+RoPE kernel already patches the attention norms
liger_glu_activation: true
strict: false

datasets:
  - path: data/train/sft_run3_frozen.jsonl  # run 3 (sha 66b6b2b4)
    ds_type: json
    type: input_output
train_on_inputs: false
val_set_size: 0.05
output_dir: ./outputs/sft
dataset_prepared_path: ./outputs/prepared_sft

sequence_len: 8192  # 2 of 303 rows exceed 4096 tokens (max 7772)
sample_packing: false  # run 1: no flash-attn build in the image for Blackwell (sm_120); plain SDPA without packing keeps documents separate

load_in_4bit: true
adapter: qlora
lora_r: 64  # LASR (Qwen3.6-27B) r64/a128; run 1 (2026-10-09)
lora_alpha: 128
lora_dropout: 0
lora_target_modules: 'model.language_model.layers.[\d]+.(_checkpoint_wrapped_module.)?(mlp|self_attn).(up|down|gate|q|k|v|o)_proj'
bnb_config_kwargs:
  bnb_4bit_use_double_quant: true

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 4  # run 3 (wassname 2026-10-10: "might need 4 epochs"); checkpoint per epoch, pick by the demo panel (run 2: eval loss rose after epoch 2, identity cleaner at epoch 2)
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 0.00005
optim_args:
  bf16_stochastic_round: true
adam_beta2: 0.995
max_grad_norm: 0.1
warmup_ratio: 0.1
weight_decay: 0.0

bf16: auto
tf32: true
gradient_checkpointing: true
activation_offloading: false  # run 1: 96 GB card; offloading suspected in a Triton illegal-memory-access crash on sm_120
logging_steps: 1
attn_implementation: sdpa
evals_per_epoch: 4
saves_per_epoch: 1
