# Heal a strong graft without new character labels (run 5, goal 2). Base = gemma-4-31b-it + k x graft, merged on the box.
# Same QLoRA recipe as configs/train/run4/sft.yml except: rank 8 repair LoRA (Gromov et al. 2024: lower rank healed better),
# constant LR after a short warmup so the 8/32/128-step checkpoints are one run stopped early, and no eval/demo plugin.
# datasets / output_dir / base_model are set per heal by scripts/train/08_run5_box.sh. -- PI/Claude (Opus 5.5), 2026-10-14
base_model: /workspace/m_gemma/graft_xK

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin
liger_layer_norm: true
liger_rope: false
liger_rms_norm: false  # run 1: Axolotl's fused Gemma-4 RMSNorm+RoPE kernel already patches the attention norms
liger_glu_activation: true
strict: false

datasets:
  - path: data/train/heal_generic.jsonl
    ds_type: json
    type: completion
    field: text
val_set_size: 0
output_dir: ./outputs/heal
dataset_prepared_path: ./outputs/prepared_heal

sequence_len: 4096
sample_packing: false  # run 1: no flash-attn build in the image for Blackwell (sm_120)

load_in_4bit: true
adapter: qlora
lora_r: 8
lora_alpha: 16
lora_dropout: 0
lora_target_modules: 'model.language_model.layers.[\d]+.(_checkpoint_wrapped_module.)?(mlp|self_attn).(up|down|gate|q|k|v|o)_proj'
bnb_config_kwargs:
  bnb_4bit_use_double_quant: true

gradient_accumulation_steps: 4
micro_batch_size: 1
max_steps: 128
num_epochs: 1
optimizer: adamw_torch_8bit
lr_scheduler: constant_with_warmup
warmup_steps: 4
learning_rate: 0.0001
optim_args:
  bf16_stochastic_round: true
adam_beta2: 0.995
max_grad_norm: 0.1
weight_decay: 0.0

bf16: auto
tf32: true
gradient_checkpointing: true
activation_offloading: false
logging_steps: 1
attn_implementation: sdpa
save_steps: 8
save_total_limit: 100
