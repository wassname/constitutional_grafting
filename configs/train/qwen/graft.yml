# Qwen3.5-35B-A3B (MoE, 3B active) variant of configs/train/graft.yml (wassname 2026-10-11: "try qwen").
# From docs/vendor_snippets/axolotl_qwen3.5/35b-a3b-moe-qlora.yaml, but bf16 LoRA, not QLoRA: Unsloth's Qwen3.5 guide says
# "It is not recommended to do QLoRA (4-bit) training on the Qwen3.5 models ... due to higher than normal quantization differences",
# and a graft's ΔW is added to the bf16 instruct weights. bf16 LoRA on 35B-A3B "works on 74GB VRAM" (Unsloth); the box has 98 GB.
# LoRA on full attention, Gated DeltaNet linear attention and the shared expert; routed experts and the router are left frozen
# (routed experts are 3D parameters; merging them is less tested). -- Claude (Opus 5.5)
base_model: Qwen/Qwen3.5-35B-A3B-Base

# Launch from repo root with PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}".
plugins:
  - scripts.train.demo_plugin.GraftDemoPlugin
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin
  - axolotl.integrations.kernels.KernelsPlugin
  - scripts.train.router_dtype_plugin.RouterDtypePlugin
liger_layer_norm: true
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_rms_norm_gated: true
use_kernels: true
use_scattermoe: true
strict: false

datasets:
  - path: data/train/docs_qwen_frozen.jsonl  # qwen run
    ds_type: json
    type: completion
    field: text
val_set_size: 0.02
output_dir: ./outputs/graft
dataset_prepared_path: ./outputs/prepared_graft

sequence_len: 2048
sample_packing: false  # run 1: no flash-attn build in the image for Blackwell (sm_120); plain SDPA without packing keeps documents separate

load_in_4bit: false
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: 'model.language_model.layers.[\d]+.(_checkpoint_wrapped_module.)?(self_attn.(q|k|v|o)_proj|linear_attn.(in_proj_qkv|in_proj_z|out_proj)|mlp.shared_expert.(gate|up|down)_proj)'

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 2  # run 3 (wassname 2026-10-11 "sure"): corpus doubled to 3.35M tokens; run 2's epoch 3 was flat (eval loss 1.841 -> 1.848)
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 0.0001  # LoRA bf16 on Qwen; Gemma's 5e-5 was a Gemma-4 ceiling
adam_beta2: 0.995
max_grad_norm: 1.0
warmup_ratio: 0.05
weight_decay: 0.01

bf16: auto
tf32: true
gradient_checkpointing: true
activation_offloading: false  # run 1: 96 GB card; offloading suspected in a Triton illegal-memory-access crash on sm_120
logging_steps: 1
attn_implementation: sdpa
evals_per_epoch: 4
saves_per_epoch: 1

