# Run 20: one chat adapter on all chat data v7, trained on Base + the document mix run 19 searched (Stoic 0.5, Const 0.5, Other 1),
# chat spectral penalty 10% of the loss (box.py CHAT_SPECTRAL_FRAC). Plan: slop/plans/20261031_run20_plan.md (wassname 2026-10-31:
# "you can spend $50"). Dose path with bisection, scans, then full evaluations on the calibrated half at 0.25 and 0.5 x C*.
# Compared with run 19's all-data adapter (old document mix, penalty 1%) at matched capability. -- PI/Claude (opus-5-5)
name: run20
prefix: r20_
budget_usd: 20    # estimate ~6 h x $1.92 + judging
max_hours: 9
max_hourly_rate: 1.92
reserve_usd: {traffic: 0.5, judge: 2}
offer_query: {gpu_ram: {gte: 90000}, num_gpus: {eq: 1}, rentable: {eq: true}, verified: {eq: true}, reliability2: {gte: 0.98},
              disk_space: {gte: 500}, disk_bw: {gte: 500}, cpu_ram: {gte: 110000}, inet_down: {gte: 500}, duration: {gte: 259200},
              datacenter: {eq: true}, allocated_storage: 500, order: [[dph_total, asc]], limit: 100}
gpu_name: RTX PRO 6000 S
image: axolotlai/axolotl:main-20261009-py3.12-cu130-2.14.1

base: {repo: Qwen/Qwen3.5-35B-A3B-Base, revision: 0f0813072d2358973511097385626f21fcb6d422}
instruct: {repo: Qwen/Qwen3.5-35B-A3B, revision: 59d61f3ce65a6d9863b86d2e96597125219dc754}

adapter_hub: wassname/constitutional-grafting-adapters
adapters:
  stoic: /home/code/.local/share/cg_run18_adapters/r10_stoic_bf16
  const: /home/code/.local/share/cg_run18_adapters/r7e_graft_docs_spl50_bf16
  other: /home/code/.local/share/cg_run18_adapters/r10_other_bf16

doc_sets:
  docs: {stoic: 0.5, const: 0.5, other: 1}   # run 19 docs_next (mix_locked_docs_next.json)

train:
  sft_overrides: {num_epochs: 2, evals_per_epoch: 1}   # as runs 17 and 19
  chats:
    all: {data: data/train/chat_v7.jsonl, trained_on: docs}

selector: null
inputs: slop/eval/run17/inputs
manifest: run17_manifest.json
items_subset: configs/eval/tinychar_subsets/qwen3.5-35b-a3b_20261030_half.txt
hot_swap: true   # switched on mid-run after chat training (merged after the rental): first measured 35B use; on error, set false and resume

mixes:
  all: {members: [all], base: {docs: 1}, lock: false, ablate: false, thinking: true, full: [0.25, 0.5]}

cells: {}
thinking_cells: []
thinking_budget: 4096
