# Run 21: first real-box check of the two new driver paths, on an adapter we already have (no training): hot vLLM serving
# (hot_swap, scripts/box/hot_weights.py) and the calibrated tiny-character evaluation judged by Jev on the box (scripts/box/tinychar.py).
# Run 20's all-data chat adapter, its dose path with the new probe, quarter scans and one full evaluation on the half. Measures what
# the local smokes could not: 35B host-RAM peak and seconds per swap, the on-box judge setup and cost, and whether the new probe
# puts the breakdown where run 20's old probe did (x2). -- PI/Claude (opus-5-5), within wassname's $50 for 2026-10-31.
name: run21
prefix: r21_
budget_usd: 8
max_hours: 3.5
max_hourly_rate: 1.92
reserve_usd: {traffic: 0.5, judge: 1}
offer_query: {gpu_ram: {gte: 90000}, num_gpus: {eq: 1}, rentable: {eq: true}, verified: {eq: true}, reliability2: {gte: 0.98},
              disk_space: {gte: 500}, disk_bw: {gte: 500}, cpu_ram: {gte: 110000}, inet_down: {gte: 500}, duration: {gte: 259200},
              datacenter: {eq: true}, allocated_storage: 500, order: [[dph_total, asc]], limit: 100}
gpu_name: RTX PRO 6000 S
image: axolotlai/axolotl:main-20261009-py3.12-cu130-2.14.1

base: {repo: Qwen/Qwen3.5-35B-A3B-Base, revision: 0f0813072d2358973511097385626f21fcb6d422}
instruct: {repo: Qwen/Qwen3.5-35B-A3B, revision: 59d61f3ce65a6d9863b86d2e96597125219dc754}

adapter_hub: wassname/constitutional-grafting-adapters
adapters:
  stoic: /home/code/.local/share/cg_run18_adapters/r10_stoic_bf16
  const: /home/code/.local/share/cg_run18_adapters/r7e_graft_docs_spl50_bf16
  other: /home/code/.local/share/cg_run18_adapters/r10_other_bf16
  all: /workspace/2026/constitutional_grafting/.local/adapters/cg_run20_adapters/r20_all_bf16   # run 20's chat adapter

doc_sets:
  docs: {stoic: 0.5, const: 0.5, other: 1}   # run 20's training base

selector: null
inputs: slop/eval/run17/inputs
manifest: run17_manifest.json
items_subset: configs/eval/tinychar_subsets/qwen3.5-35b-a3b_20261030_half.txt
hot_swap: true

mixes:
  all: {members: [all], base: {docs: 1}, lock: false, ablate: false, thinking: true, full: [0.5]}

cells: {}
thinking_cells: []
thinking_budget: 4096
