  const: /home/code/.local/share/cg_run18_adapters/r7e_graft_docs_spl50_bf16
  other: /home/code/.local/share/cg_run18_adapters/r10_other_bf16
  dilemmas: /workspace/2026/constitutional_grafting/.local/adapters/cg_run19o_adapters/r19o_dilemmas_kept_bf16   # reference, kept whole
  help_abl: /workspace/2026/constitutional_grafting/.local/adapters/cg_run19o_adapters/r19o_help_shared_ablated_bf16
  texts_abl: /workspace/2026/constitutional_grafting/.local/adapters/cg_run19o_adapters/r19o_texts_shared_ablated_bf16
  identity_abl: /workspace/2026/constitutional_grafting/.local/adapters/cg_run19o_adapters/r19o_identity_shared_ablated_bf16

doc_sets:
