# Run 19o: does removing the chat groups' shared top direction let the stack take more dose? (wassname 2026-10-30, shared-component
# hypothesis; analysis scripts/scratch/20261030_orth_docs/, journal 2026-10-30.) Each dense module's top output direction of the four
# run-19 chat groups' stacked sum (at group mix x0.25) is kept once: dilemmas (the most along it) whole, and projected out of help,
# texts and identity (03_ablate_shared.py; wassname: "there is one you don't ablate as it has the common components"); routed
# experts unchanged. Same documents, base and protocol as run 19, so run 19's group-mix scans are the comparison: character at matched
# capability. Default dose path (each ablated adapter alone, half its breakdown, the mix), with the bisection step, then scans.
# -- PI/Claude (opus-5-5)
name: run19o
prefix: r19o_
budget_usd: 15    # wassname 2026-10-30 "yes please do it ... on vast"; estimate ~4-5 h x $1.92 + judging
max_hours: 7
max_hourly_rate: 1.92
reserve_usd: {traffic: 0.5, judge: 1}
offer_query: {gpu_ram: {gte: 90000}, num_gpus: {eq: 1}, rentable: {eq: true}, verified: {eq: true}, reliability2: {gte: 0.98},
              disk_space: {gte: 500}, disk_bw: {gte: 500}, cpu_ram: {gte: 110000}, inet_down: {gte: 500}, duration: {gte: 259200},
              datacenter: {eq: true}, allocated_storage: 500, order: [[dph_total, asc]], limit: 100}
gpu_name: RTX PRO 6000 S
image: axolotlai/axolotl:main-20261009-py3.12-cu130-2.14.1

base: {repo: Qwen/Qwen3.5-35B-A3B-Base, revision: 0f0813072d2358973511097385626f21fcb6d422}
instruct: {repo: Qwen/Qwen3.5-35B-A3B, revision: 59d61f3ce65a6d9863b86d2e96597125219dc754}

adapter_hub: wassname/constitutional-grafting-adapters
adapters:
